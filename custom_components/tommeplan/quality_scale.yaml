rules:
  # Bronze
  action-setup:
    status: exempt
    comment: Integration registers no service actions.
  appropriate-polling:
    status: done
    comment: 24-hour polling of a yearly schedule.
  brands:
    status: todo
    comment: Brand assets not yet submitted to home-assistant/brands.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions:
    status: exempt
    comment: No service actions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions:
    status: todo
    comment: README does not yet include explicit removal instructions.
  entity-event-setup:
    status: exempt
    comment: Entities receive updates via the coordinator; no extra subscriptions to manage.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: The address search in the config flow exercises the API before the entry is created.
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions:
    status: exempt
    comment: No service actions.
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No reconfigurable parameters after setup.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: >
      Authentication uses constants compiled into the integration
      (applikasjonsId / oppdragsgiverId per kommune), not user-supplied
      credentials, so reauth has no actionable input.
  test-coverage:
    status: todo
    comment: Config-flow and setup/unload are covered; entity-state coverage pending.

  # Gold tier not yet targeted.
